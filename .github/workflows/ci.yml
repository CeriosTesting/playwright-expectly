name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Type & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm run build --workspace=packages/playwright-expectly-core

      - name: Build all packages
        run: npm run build

      - name: Run linter and type check
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build core package
        run: npm run build --workspace=packages/playwright-expectly-core

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm run test

      # Exercises engine-provided Temporal values; Expectly only prefers the global when it conforms to the spec.
      - name: Run expectly tests with native Temporal
        if: matrix.node-version == 24
        run: node --harmony-temporal node_modules/@playwright/test/cli.js test --config=playwright.config.ts --project=expectly

  minimum-playwright:
    name: Published packages (Playwright 1.40)
    runs-on: ubuntu-22.04
    steps:
      # The runner context is not available in job-level env, so derive the path inside a step.
      - run: echo "CONSUMER=$RUNNER_TEMP/expectly-minimum-consumer" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Install release artifacts into an isolated consumer
        run: |
          mkdir -p "$CONSUMER"
          npm pack --workspaces --pack-destination "$CONSUMER" --ignore-scripts
          cp tests/compatibility/*.ts "$CONSUMER/"
          npm install --prefix "$CONSUMER" --no-save --package-lock=false --ignore-scripts @playwright/test@1.40.0 typescript@5.9.3 @types/node@22 "$CONSUMER"/*.tgz
      - name: Check published declarations without skipLibCheck
        run: |
          cd "$CONSUMER"
          node node_modules/typescript/bin/tsc --noEmit --strict --target es2020 --types node --module commonjs consumer.spec.ts playwright.config.ts
      - name: Test minimum-version runtime and browser matchers
        run: |
          cd "$CONSUMER"
          node node_modules/playwright/cli.js install --with-deps chromium
          node node_modules/playwright/cli.js test --config=playwright.config.ts
